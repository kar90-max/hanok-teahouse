name: Android APK 빌드

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Godot 4.3 → debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3

      - name: Android SDK 패키지 설치 (build-tools 34 / platform 34)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "build-tools;34.0.0" "platforms;android-34"
          sdkmanager --list_installed | head -20

      - name: 디버그 키스토어 생성
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12

      - name: Godot 4.3 실행 파일 캐시
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/Godot_v4.3-stable_linux.x86_64
            ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-stable-templates-v1

      - name: Godot 4.3 + 내보내기 템플릿 내려받기
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -o -q Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates
          unzip -o -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot_templates
          mv /tmp/godot_templates/templates ~/.local/share/godot/export_templates/4.3.stable
          ls ~/.local/share/godot/export_templates/4.3.stable | head

      - name: Godot 실행 권한
        run: |
          chmod +x ~/godot/Godot_v4.3-stable_linux.x86_64
          ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --version

      - name: Godot 에디터 설정 (Android SDK · 키스토어 경로)
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${GITHUB_WORKSPACE}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: 프로젝트 가져오기 (.godot 캐시 생성)
        run: |
          ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --import || \
            ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --import

      - name: APK 내보내기
        run: |
          mkdir -p build
          ~/godot/Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/hanok-teahouse-debug.apk
          ls -lh build/

      - name: APK 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: hanok-teahouse-android-apk
          path: build/hanok-teahouse-debug.apk
          if-no-files-found: error
          retention-days: 30
